[GENERAL]

# Turns the mod on and off. While it is off, loading a save and returning to the main menu work the way they do without the mod.
bModActive = true

# Skips the intro movie when the game is relaunched by this mod. The first launch of the session is not affected.
bSkipIntroMovie = true

# Hides the "Skyrim is reloading" window shown while the game restarts.
bSilentReload = false
